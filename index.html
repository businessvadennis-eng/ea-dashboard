<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cio EA Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top nav, centered 1200px page; Projects = summary row, filter chips, table with mini gantt */
:root{
  --surface:#EEF2F1; --card:#FFFFFF; --chip:#F2F6F5; --hover:#F6F9F8; --ink:#12201E; --muted:#5B6E6A; --line:#E1E8E6; --line-strong:#BCCBC7;
  --accent:#0E7C6E; --accent-2:#2FA88F; --accent-soft:#D9F1EB; --accent-ink:#095A50; --track:#DCEAF8;
  --good:#1E8E4E; --good-soft:#DDF3E4; --warn:#B87700; --warn-bar:#E4A21B; --warn-soft:#FBEFD3; --bad:#C93A3A; --bad-bar:#DE4B4B; --bad-soft:#FBE1E0;
  --av-a:#D9F1EB; --av-b:#E6E7F6; --av-c:#F6E9DC; --av-d:#E3EEF8;
  --shadow:0 1px 2px rgba(18,32,30,.05),0 6px 20px -14px rgba(18,32,30,.2);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --surface:#0C1413; --card:#14201F; --chip:#1A2928; --hover:#182625; --ink:#E5EFED; --muted:#93A7A2; --line:#22312F; --line-strong:#3A4F4C;
  --accent:#3CC2AE; --accent-2:#1F8E7C; --accent-soft:#163E38; --accent-ink:#A4E9DC; --track:#1D3347;
  --good:#5FD08E; --good-soft:#163A26; --warn:#F0B544; --warn-bar:#E4A21B; --warn-soft:#3D2F12; --bad:#FF7B7B; --bad-bar:#E25656; --bad-soft:#431E1E;
  --av-a:#1C443E; --av-b:#2A2C4A; --av-c:#47362A; --av-d:#213A4F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* TopNav */
.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.nav-in{max-width:1232px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo-tile{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font:700 12.5px var(--f-display);letter-spacing:.02em}
.logo-name{font:600 16px var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:24px;height:100%}
.tab{position:relative;display:flex;align-items:center;height:100%;padding:0 2px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tab-ext{font-size:11px;opacity:.6;margin-left:4px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn svg{width:15px;height:15px}
.me{width:34px;height:34px;border-radius:50%;background:var(--av-b);display:grid;place-items:center;font:700 12px var(--f-body);flex:none}
.mtabs{display:none}

/* Page */
.page{max-width:1232px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:700 34px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font:500 14px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font:600 24px/1.15 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--muted)}
.sample{font-size:11.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:999px;padding:2px 10px}

/* HealthSummary */
.summary{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
.scard{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;gap:3px;height:10px}
.stack span{border-radius:3px;min-width:6px}
.seg-good{background:var(--good)} .seg-warn{background:var(--warn-bar)} .seg-bad{background:var(--bad-bar)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:3px}
.ldot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.thin{height:4px;border-radius:4px;background:var(--chip);overflow:hidden}
.thin span{display:block;height:100%;background:var(--accent);border-radius:inherit}
.muted{color:var(--muted)}
.ending{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ending li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ending b{color:var(--ink);font-weight:600}

/* FilterChips */
.filters{display:flex;align-items:center;gap:12px;margin:20px 0 14px}
.chips{display:flex;gap:8px;min-width:0}
.chipb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;flex:none}
.chipb:hover{background:var(--hover)}
.chipb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chipb .n{font:500 11.5px var(--f-mono);opacity:.7}
.today-label{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.today-label b{color:var(--ink);font-weight:600}

/* PortfolioTable */
.tablecard{overflow:hidden}
.tscroll{overflow-x:auto}
.table{min-width:900px}
.cols{display:grid;grid-template-columns:minmax(220px,1.45fr) 124px minmax(280px,2fr) minmax(170px,1fr);column-gap:22px;align-items:center}
.thead{height:52px;padding:0 20px;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tlhead{position:relative;align-self:stretch}
.month{position:absolute;bottom:8px;transform:translateX(-50%);font-size:11px;letter-spacing:.05em}
.today-pill{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink);color:var(--card);font:600 10.5px/1 var(--f-body);letter-spacing:.03em;text-transform:none;padding:4px 8px;border-radius:999px;white-space:nowrap;z-index:2}
.tlhead::after{content:"";position:absolute;left:var(--today);top:22px;bottom:-1px;width:1px;background:var(--ink);opacity:.8}
.prow{border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.row{width:100%;text-align:left;background:none;border:0;padding:14px 20px;cursor:pointer;border-radius:0}
.row:hover{background:var(--hover)}
.row:focus-visible{outline-offset:-2px;border-radius:4px}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f-body);letter-spacing:.02em;color:var(--ink)}
.av-a{background:var(--av-a)} .av-b{background:var(--av-b)} .av-c{background:var(--av-c)} .av-d{background:var(--av-d)}
.pname{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pclient{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptext{min-width:0;display:block}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.tlcell{position:relative;align-self:stretch;min-height:28px;display:block}
.tlcell::after{content:"";position:absolute;left:var(--today);top:-14px;bottom:-15px;width:1px;background:var(--ink);opacity:.8;z-index:1}
.mline{position:absolute;top:-14px;bottom:-15px;width:1px;background:var(--line)}
.gbar{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:999px;background:var(--track);overflow:hidden;transform-origin:left center;display:block}
.gfill{display:block;height:100%;background:var(--accent);border-radius:inherit}
.burn{display:block}
.burn-top{display:flex;align-items:baseline;gap:8px}
.burn-pct{font:600 14px var(--f-body);font-variant-numeric:tabular-nums}
.burn-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.btrack{display:block;height:6px;border-radius:6px;background:var(--chip);margin-top:7px;overflow:hidden}
.bfill{display:block;height:100%;border-radius:inherit;background:var(--accent);transform-origin:left center}
.bfill.warn{background:var(--warn-bar)} .bfill.bad{background:var(--bad-bar)}
.burn-pct.bad{color:var(--bad)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows 450ms cubic-bezier(.32,.72,0,1)}
.detail.open{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px 20px 20px 64px}
.dbox{background:var(--chip);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dbox strong{font-size:14px}
.dbox .who{display:flex;align-items:center;gap:10px}
.dbox .av{width:28px;height:28px;font-size:10px}
.prog{height:6px;border-radius:6px;background:var(--card);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}
.empty-row{padding:28px 20px;color:var(--muted)}

.anim .prow{animation:rowIn 420ms cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.anim .gbar,.anim .bfill{animation:grow 800ms cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms + 80ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Tasks */
.tasks-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.addform{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 110px auto;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.field{height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);padding:0 12px;min-width:0;width:100%}
.field:focus-visible{outline-offset:0}
.tlist{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto 32px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.enter{animation:rowIn 360ms cubic-bezier(.2,.7,.2,1) both}
.cb{width:20px;height:20px;padding:0;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.cb svg{width:12px;height:12px;stroke:var(--card);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cb path{stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .35s cubic-bezier(.34,1.56,.64,1)}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.cb[aria-checked="true"] path{stroke-dashoffset:0}
.ttitle{font-weight:600;text-decoration:line-through;text-decoration-color:transparent;transition:color .2s,text-decoration-color .2s;overflow-wrap:anywhere}
.task.done .ttitle{color:var(--muted);text-decoration-color:var(--muted)}
.tmeta{display:flex;gap:8px;margin-top:3px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.tag{padding:1px 8px;border-radius:999px;background:var(--chip);font-weight:600;font-size:11.5px}
.tag.biz{background:var(--accent-soft);color:var(--accent-ink)}
.tag.per{background:var(--av-b)}
.pri{display:inline-flex;align-items:center;gap:5px}
.pri i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.pri.High i{background:var(--bad-bar)} .pri.Medium i{background:var(--warn-bar)}
.due{font:500 11.5px var(--f-mono);padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.due.today{background:var(--accent-soft);color:var(--accent-ink)}
.due.over{background:var(--bad-soft);color:var(--bad)}
.del{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.del:hover{background:var(--chip);color:var(--ink)}
.del svg{width:15px;height:15px}
.side{display:flex;flex-direction:column;gap:16px}
.split{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.splitbar{display:flex;height:10px;gap:3px}
.splitbar span{border-radius:3px;min-width:6px}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* Resources */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.clocks{padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.clock{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.clock:last-of-type{border-bottom:0}
.clock .t{font:600 24px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .z{font-weight:600}
.clock .d{font-size:12px;color:var(--muted)}
.shift{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.links{padding:18px 20px}
.links h2,.clocks h2{font:600 16px var(--f-display);margin:0 0 6px}
.linkform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;margin:12px 0 6px}
.llist{list-style:none;margin:0;padding:0}
.llist li{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.llist li:last-child{border-bottom:0}
.favi{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-display)}
.llist a{font-weight:600;text-decoration:none;display:block}
.llist a:hover{text-decoration:underline}
.llist .u{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.err{color:var(--bad);font-size:12.5px;min-height:18px;margin:0}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font:600 18px var(--f-display);margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
label.l{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.l .field{color:var(--ink);font-weight:400}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}

@media (prefers-reduced-motion: reduce){
  .anim .prow,.anim .gbar,.anim .bfill,.task.enter{animation:none}
  .detail{transition:none}
}
@media (max-width:960px){
  .tasks-layout,.res{grid-template-columns:1fr}
  .addform{grid-template-columns:1fr 1fr}
  .addform .field:first-child,.addform .btn{grid-column:1/-1;justify-content:center}
}
@media (max-width:760px){
  .tabs{display:none}
  .logo-name{font-size:15px}
  .nav-right .btn-primary .lbl-long{display:none}
  .mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtabs .tab{height:32px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13px}
  .mtabs .tab[aria-current="page"]{background:var(--ink);color:var(--card)}
  .mtabs .tab[aria-current="page"]::after{display:none}
  .summary{grid-template-columns:1fr}
  .filters{flex-wrap:wrap}
  .chips{overflow-x:auto;scrollbar-width:none;width:100%;order:2;padding-bottom:2px}
  .today-label{margin-left:0;order:1}
  .table{min-width:0}
  .cols{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .thead{display:none}
  .tlcell{display:none}
  .burn{grid-column:1/-1;padding-left:44px}
  .dgrid{grid-template-columns:1fr;padding:0 16px 18px}
  .row{padding:14px 16px}
  .addform{grid-template-columns:1fr 1fr}
  .linkform{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .task{grid-template-columns:22px minmax(0,1fr) 32px}
  .task .due{grid-column:2;justify-self:start;grid-row:2}
  .task .del{grid-row:1;grid-column:3}
}
</style>
</head>
<body>
<div id="nav"></div>
<main class="page" id="page"></main>

<dialog id="dlg" aria-labelledby="dlg-h">
  <form class="dlg" id="pform" novalidate>
    <h2 id="dlg-h">New project</h2>
    <div class="fgrid">
      <label class="l full">Project name<input class="field" id="f-name" required placeholder="e.g. Q1 investor roadshow"></label>
      <label class="l">For (client or stakeholder)<input class="field" id="f-client" placeholder="e.g. Daniel Brooks"></label>
      <label class="l">Owner<input class="field" id="f-owner" value="Cio"></label>
      <label class="l">Start date<input class="field" id="f-start" type="date" required></label>
      <label class="l">End date<input class="field" id="f-end" type="date" required></label>
      <label class="l">Budget (USD)<input class="field" id="f-budget" type="number" min="0" step="100" required placeholder="10000"></label>
      <label class="l">Spent so far (USD)<input class="field" id="f-spent" type="number" min="0" step="100" value="0"></label>
      <label class="l">Health<select class="field" id="f-health"><option value="good">On track</option><option value="warn">At risk</option><option value="bad">Off track</option></select></label>
      <label class="l">Progress (%)<input class="field" id="f-progress" type="number" min="0" max="100" value="0"></label>
      <label class="l full">Next milestone<input class="field" id="f-ms" placeholder="e.g. Kickoff call"></label>
    </div>
    <p class="err" id="f-err" role="alert"></p>
    <div class="dlg-actions"><button type="button" class="btn" id="f-cancel">Cancel</button><button type="submit" class="btn btn-primary">Add project</button></div>
  </form>
</dialog>

<script>
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const parseD = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtShort = d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const initials = n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const avClass = n=>'av-'+'abcd'[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%4];
const load = (k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}};
const save = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HEALTH = {good:'On track', warn:'At risk', bad:'Off track'};

/* ---------- Projects view ---------- */
const RANGE = {start:new Date(2026,8,1), end:new Date(2027,0,1)};
const pct = d=>Math.max(0,Math.min(100,(d-RANGE.start)/(RANGE.end-RANGE.start)*100));
const health = p=>p.health;
const burnPct = p=>p.budget? Math.round(p.spent/p.budget*100) : 0;

function HealthSummary(list){
  const c = {good:0,warn:0,bad:0}; list.forEach(p=>c[p.health]++);
  const budget = list.reduce((a,p)=>a+p.budget,0), spent = list.reduce((a,p)=>a+p.spent,0);
  const burn = budget? Math.round(spent/budget*100):0;
  const ending = list.filter(p=>{const e=parseD(p.end);return e.getMonth()===TODAY.getMonth()&&e.getFullYear()===TODAY.getFullYear()});
  const monthName = TODAY.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const seg = (k,cls)=>c[k]?`<span class="${cls}" style="flex-grow:${c[k]}" title="${HEALTH[k]}: ${c[k]}"></span>`:'';
  return `<section class="summary" aria-label="Portfolio summary">
    <div class="card scard">
      <div class="eyebrow">Portfolio health</div>
      <div class="big">${list.length}<small>active projects</small></div>
      <div class="stack" role="img" aria-label="${c.good} on track, ${c.warn} at risk, ${c.bad} off track">${seg('good','seg-good')}${seg('warn','seg-warn')}${seg('bad','seg-bad')}</div>
      <div class="legend"><span><i class="ldot seg-good"></i>On track<b>${c.good}</b></span><span><i class="ldot seg-warn"></i>At risk<b>${c.warn}</b></span><span><i class="ldot seg-bad"></i>Off track<b>${c.bad}</b></span></div>
    </div>
    <div class="card scard">
      <div class="eyebrow">Budget burn</div>
      <div class="big">${burn}%</div>
      <div class="thin" aria-hidden="true"><span style="width:${Math.min(burn,100)}%"></span></div>
      <div class="muted" style="font-size:13px;font-variant-numeric:tabular-nums">${money(spent)} of ${money(budget)} spent</div>
    </div>
    <div class="card scard">
      <div class="eyebrow">Ending this month</div>
      <div class="big">${ending.length}<small>in ${monthName}</small></div>
      <ul class="ending">${ending.length?ending.map(p=>`<li><b>${esc(p.name)}</b> · ${parseD(p.end).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</li>`).join(''):'<li>Nothing wraps up this month.</li>'}</ul>
    </div>
  </section>`;
}

function FilterChips(list){
  const c = {all:list.length,good:0,warn:0,bad:0}; list.forEach(p=>c[p.health]++);
  const chips = [['all','All'],['good','On track'],['warn','At risk'],['bad','Off track']];
  return `<div class="filters">
    <div class="chips" role="group" aria-label="Filter projects by health">${chips.map(([k,l])=>`<button type="button" class="chipb" data-filter="${k}" aria-pressed="${state.filter===k}">${l}<span class="n">${c[k]}</span></button>`).join('')}</div>
    <div class="today-label">Today · <b>${TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</b></div>
  </div>`;
}

function GanttBar(p){
  const l = pct(parseD(p.start)), r = pct(addDays(parseD(p.end),1));
  return `<span class="gbar" style="left:${l}%;width:${Math.max(r-l,1.5)}%" title="${esc(p.start)} to ${esc(p.end)}"><span class="gfill" style="width:${p.progress}%"></span></span>`;
}

function monthMarks(){
  const out=[]; for(let m=0;m<4;m++){const s=new Date(2026,8+m,1),e=new Date(2026,9+m,1);out.push({label:s.toLocaleDateString('en-US',{month:'short'}),start:pct(s),mid:(pct(s)+pct(e))/2})} return out;
}

function ProjectRow(p,i){
  const b = burnPct(p), bcls = b>100?'bad':b>=90?'warn':'';
  const open = state.openId===p.id;
  const lines = monthMarks().slice(1).map(m=>`<span class="mline" style="left:${m.start}%"></span>`).join('');
  const s=parseD(p.start), e=parseD(p.end);
  return `<div class="prow" style="--i:${i}">
    <button type="button" class="row cols" aria-expanded="${open}" aria-controls="d-${p.id}" data-id="${p.id}">
      <span class="pcell"><span class="av ${avClass(p.owner)}" aria-hidden="true">${esc(initials(p.owner))}</span><span class="ptext"><span class="pname">${esc(p.name)}</span><span class="pclient">${esc(p.client)}</span></span></span>
      <span><span class="pill ${p.health}"><i aria-hidden="true"></i>${HEALTH[p.health]}</span></span>
      <span class="tlcell" aria-label="Timeline ${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})} to ${e.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${p.progress}% complete">${lines}${GanttBar(p)}</span>
      <span class="burn"><span class="burn-top"><span class="burn-pct ${b>100?'bad':''}">${b}%</span><span class="burn-sub">${money(p.spent)} of ${money(p.budget)}</span></span><span class="btrack" aria-hidden="true"><span class="bfill ${bcls}" style="width:${Math.min(b,100)}%"></span></span></span>
    </button>
    <div class="detail ${open?'open':''}" id="d-${p.id}" role="region" aria-label="${esc(p.name)} details">
      <div class="detail-in"><div class="dgrid">
        <div class="dbox"><span class="eyebrow">Next milestone</span><strong>${esc(p.ms||'Not set')}</strong><span class="muted" style="font-size:12.5px">${p.msDate?fmtShort(parseD(p.msDate)):'No date yet'}</span></div>
        <div class="dbox"><span class="eyebrow">Owner</span><span class="who"><span class="av ${avClass(p.owner)}" aria-hidden="true">${esc(initials(p.owner))}</span><span><strong style="display:block">${esc(p.owner)}</strong><span class="muted" style="font-size:12.5px">${esc(p.role||'')}</span></span></span></div>
        <div class="dbox"><span class="eyebrow">Progress</span><strong>${p.progress}% complete</strong><span class="prog" aria-hidden="true"><span style="width:${p.progress}%"></span></span><span class="muted" style="font-size:12.5px">${fmtShort(s)} – ${fmtShort(e)}</span></div>
      </div></div>
    </div>
  </div>`;
}

function PortfolioTable(list){
  const rows = list.filter(p=>state.filter==='all'||p.health===state.filter);
  const tp = pct(TODAY), inRange = TODAY>=RANGE.start && TODAY<RANGE.end;
  const months = monthMarks().map(m=>`<span class="month" style="left:${m.mid}%">${m.label}</span>`).join('');
  return `<section class="card tablecard" aria-label="Projects">
    <div class="tscroll"><div class="table ${reduced?'':'anim'}" id="ptable" style="--today:${inRange?tp+'%':'-9999px'}">
      <div class="thead cols" aria-hidden="true"><span>Project</span><span>Health</span><span class="tlhead">${inRange?`<span class="today-pill" style="left:${tp}%">Today</span>`:''}${months}</span><span>Budget burn</span></div>
      <div id="prows">${rows.length?rows.map(ProjectRow).join(''):'<div class="empty-row">No projects match this filter.</div>'}</div>
    </div></div>
  </section>`;
}

function renderProjects(){
  $('#page').innerHTML = `<div class="page-head"><div><h1>Projects</h1><p>Everything you're running for the executive, at a glance.</p></div>${state.projects===SEED_PROJECTS||state.projects.some(p=>p.id.startsWith('p')&&p.id.length===2)?'<span class="sample">Example projects · add your own with New project</span>':''}</div>
    ${HealthSummary(state.projects)}${FilterChips(state.projects)}${PortfolioTable(state.projects)}`;
  $('.chips').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;state.openId=null;renderProjects();$(`[data-filter="${state.filter}"]`).focus()});
  $('#prows').addEventListener('click',e=>{
    const b=e.target.closest('.row'); if(!b)return;
    const id=b.dataset.id; state.openId = state.openId===id?null:id;
    document.querySelectorAll('#prows .row').forEach(r=>{const on=r.dataset.id===state.openId;r.setAttribute('aria-expanded',on);r.nextElementSibling.classList.toggle('open',on)});
  });
}

const dlg = $('#dlg');
function openProjectDialog(){
  $('#pform').reset(); $('#f-owner').value='Cio'; $('#f-spent').value=0; $('#f-progress').value=0; $('#f-err').textContent='';
  $('#f-start').value=iso(TODAY); $('#f-end').value=iso(addDays(TODAY,30));
  dlg.showModal(); $('#f-name').focus();
}
$('#f-cancel').addEventListener('click',()=>dlg.close());
$('#pform').addEventListener('submit',e=>{
  e.preventDefault();
  const v=id=>$(id).value.trim();
  if(!v('#f-name')) return $('#f-err').textContent='Add a project name.';
  if(!v('#f-start')||!v('#f-end')) return $('#f-err').textContent='Add a start and end date.';
  if(v('#f-end')<v('#f-start')) return $('#f-err').textContent='The end date needs to be on or after the start date.';
  if(!(+v('#f-budget')>0)) return $('#f-err').textContent='Add a budget above $0.';
  const owner=v('#f-owner')||'Cio';
  state.projects=[...state.projects,{id:'u'+Date.now(),name:v('#f-name'),client:v('#f-client')||'—',owner,role:owner==='Cio'?'Executive Assistant':'',start:v('#f-start'),end:v('#f-end'),progress:Math.max(0,Math.min(100,+v('#f-progress')||0)),budget:+v('#f-budget'),spent:+v('#f-spent')||0,health:v('#f-health'),ms:v('#f-ms'),msDate:''}];
  save('ea.projects.v1',state.projects); dlg.close(); state.filter='all'; renderProjects();
});

/* ---------- Tasks view ---------- */
function taskBucket(t){const d=parseD(t.due);if(t.done)return 'done';if(d<TODAY)return 'over';if(+d===+TODAY)return 'today';return 'up'}
function dueText(t){const n=Math.round((parseD(t.due)-TODAY)/864e5);if(t.done)return fmtShort(parseD(t.due));if(n<0)return `${-n}d overdue`;if(n===0)return 'Today';if(n===1)return 'Tomorrow';return fmtShort(parseD(t.due))}
function TaskItem(t,animate){
  const b=taskBucket(t);
  return `<li class="task ${t.done?'done':''} ${animate?'enter':''}" data-id="${t.id}">
    <button type="button" class="cb" role="checkbox" aria-checked="${t.done}" aria-label="Done: ${esc(t.title)}">${ICON.check}</button>
    <div><div class="ttitle">${esc(t.title)}</div><div class="tmeta"><span class="tag ${t.type==='Business'?'biz':'per'}">${t.type}</span><span class="pri ${t.pri}"><i aria-hidden="true"></i>${t.pri} priority</span></div></div>
    <span class="due ${b==='over'?'over':b==='today'?'today':''}">${dueText(t)}</span>
    <button type="button" class="del" aria-label="Delete ${esc(t.title)}">${ICON.x}</button>
  </li>`;
}
function renderTasks(animateId){
  const T=state.tasks, cnt={open:0,today:0,over:0,up:0,done:0};
  T.forEach(t=>{const b=taskBucket(t);cnt[b]++;if(b!=='done')cnt.open++});
  const chips=[['open','Open'],['today','Today'],['over','Overdue'],['up','Upcoming'],['done','Done']];
  const shown=T.filter(t=>state.taskFilter==='open'?!t.done:taskBucket(t)===state.taskFilter).sort((a,b)=>a.done-b.done||a.due.localeCompare(b.due)||({High:0,Medium:1,Low:2}[a.pri]-{High:0,Medium:1,Low:2}[b.pri]));
  const open=T.filter(t=>!t.done), biz=open.filter(t=>t.type==='Business').length, per=open.length-biz;
  const doneRate=T.length?Math.round(cnt.done/T.length*100):0;
  $('#page').innerHTML = `<div class="page-head"><div><h1>Tasks</h1><p>Business and personal to-dos for the executive, sorted by due date.</p></div></div>
  <div class="tasks-layout">
    <section class="card" aria-label="Task list">
      <form class="addform" id="taskform">
        <label class="sr-only" for="task-title">Task</label><input class="field" id="task-title" placeholder="Add a task, e.g. Book flights to Austin" autocomplete="off">
        <label class="sr-only" for="task-due">Due date</label><input class="field" id="task-due" type="date" value="${iso(TODAY)}">
        <label class="sr-only" for="task-type">Type</label><select class="field" id="task-type"><option>Business</option><option>Personal</option></select>
        <label class="sr-only" for="task-pri">Priority</label><select class="field" id="task-pri"><option>High</option><option selected>Medium</option><option>Low</option></select>
        <button class="btn btn-primary" type="submit">${ICON.plus}Add</button>
      </form>
      <div class="filters" style="margin:0;padding:12px 14px;border-bottom:1px solid var(--line)">
        <div class="chips" role="group" aria-label="Filter tasks">${chips.map(([k,l])=>`<button type="button" class="chipb" data-tf="${k}" aria-pressed="${state.taskFilter===k}">${l}<span class="n">${cnt[k]}</span></button>`).join('')}</div>
      </div>
      <ul class="tlist" id="tlist">${shown.length?shown.map(t=>TaskItem(t,t.id===animateId)).join(''):`<li class="empty-row">${state.taskFilter==='done'?'Nothing checked off yet.':'All clear here.'}</li>`}</ul>
    </section>
    <aside class="side">
      <div class="card split">
        <div class="eyebrow">Open tasks</div>
        <div class="big">${open.length}<small>${cnt.over?`${cnt.over} overdue`:'none overdue'}</small></div>
        <div class="splitbar" role="img" aria-label="${biz} business, ${per} personal">${biz?`<span style="flex-grow:${biz};background:var(--accent)"></span>`:''}${per?`<span style="flex-grow:${per};background:var(--line-strong)"></span>`:''}</div>
        <div class="legend"><span><i class="ldot" style="background:var(--accent)"></i>Business<b>${biz}</b></span><span><i class="ldot" style="background:var(--line-strong)"></i>Personal<b>${per}</b></span></div>
      </div>
      <div class="card split">
        <div class="eyebrow">Completed</div>
        <div class="big">${doneRate}%<small>${cnt.done} of ${T.length}</small></div>
        <div class="thin" aria-hidden="true"><span style="width:${doneRate}%"></span></div>
        <p class="note">Tasks save in this browser only. Starter tasks are examples, delete them once you add your own.</p>
      </div>
    </aside>
  </div>`;
  $('#taskform').addEventListener('submit',e=>{
    e.preventDefault(); const title=$('#task-title').value.trim(); if(!title){$('#task-title').focus();return}
    const t={id:'t'+Date.now(),title,type:$('#task-type').value,pri:$('#task-pri').value,due:$('#task-due').value||iso(TODAY),done:false};
    state.tasks=[...state.tasks,t]; save('ea.tasks.v1',state.tasks);
    if(state.taskFilter==='done')state.taskFilter='open';
    renderTasks(t.id); $('#task-title').focus();
  });
  $('.chips').addEventListener('click',e=>{const b=e.target.closest('[data-tf]');if(!b)return;state.taskFilter=b.dataset.tf;renderTasks();$(`[data-tf="${state.taskFilter}"]`).focus()});
  $('#tlist').addEventListener('click',e=>{
    const li=e.target.closest('.task'); if(!li)return; const id=li.dataset.id;
    if(e.target.closest('.cb')){
      const t=state.tasks.find(x=>x.id===id); t.done=!t.done; save('ea.tasks.v1',state.tasks);
      const cb=li.querySelector('.cb'); cb.setAttribute('aria-checked',t.done); li.classList.toggle('done',t.done);
      setTimeout(()=>{renderTasks();$(`.task[data-id="${id}"] .cb`)?.focus()},reduced?0:650);
    } else if(e.target.closest('.del')){
      state.tasks=state.tasks.filter(x=>x.id!==id); save('ea.tasks.v1',state.tasks); renderTasks(); $('#task-title').focus();
    }
  });
}

const ZONES=[{z:'Asia/Manila',n:'Davao City',s:'PHT'},{z:'America/New_York',n:'New York',s:'US Eastern'},{z:'America/Chicago',n:'Chicago',s:'US Central'},{z:'America/Los_Angeles',n:'Los Angeles',s:'US Pacific'}];
function clockHTML(){
  const now=new Date();
  const ph=+new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',hour:'numeric',hour12:false}).format(now)%24;
  const on = ph>=19||ph<5;
  return ZONES.map(o=>`<div class="clock"><div><div class="z">${o.n}</div><div class="d">${o.s} · ${new Intl.DateTimeFormat('en-US',{timeZone:o.z,weekday:'short',month:'short',day:'numeric'}).format(now)}</div></div><div class="t">${new Intl.DateTimeFormat('en-US',{timeZone:o.z,hour:'numeric',minute:'2-digit'}).format(now)}</div></div>`).join('')+
  `<div class="shift"><span class="pill ${on?'good':'warn'}"><i aria-hidden="true"></i>${on?'On shift':'Off shift'}</span><span class="muted">Your shift: 7:00 PM – 5:00 AM PHT</span></div>`;
}
function renderResources(){
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
  $('#page').innerHTML = `<div class="page-head"><div><h1>Resources</h1><p>Time zones and the tools you open every shift.</p></div></div>
  <div class="res">
    <section class="card clocks" aria-label="World clocks"><h2>Time zones</h2><div id="clocks">${clockHTML()}</div></section>
    <section class="card links" aria-label="Quick links"><h2>Quick links</h2>
      <form class="linkform" id="linkform" novalidate>
        <label class="sr-only" for="link-name">Name</label><input class="field" id="link-name" placeholder="Name, e.g. Expensify">
        <label class="sr-only" for="link-url">Web address</label><input class="field" id="link-url" placeholder="https://…" inputmode="url">
        <button class="btn btn-primary" type="submit">${ICON.plus}Add</button>
      </form>
      <p class="err" id="link-err" role="alert"></p>
      <ul class="llist">${state.links.map((l,i)=>`<li><span class="favi" aria-hidden="true">${esc(l.name[0]||'?').toUpperCase()}</span><span style="min-width:0"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a><span class="u">${esc(host(l.url))}</span></span><button type="button" class="del" data-i="${i}" aria-label="Remove ${esc(l.name)}">${ICON.x}</button></li>`).join('')||'<li class="muted">No links yet. Add the tools you use most.</li>'}</ul>
    </section>
  </div>`;
  $('#linkform').addEventListener('submit',e=>{
    e.preventDefault(); const name=$('#link-name').value.trim(); let url=$('#link-url').value.trim();
    if(!name) return $('#link-err').textContent='Add a name for the link.';
    if(url && !/^https?:\/\//i.test(url)) url='https://'+url;
    try{new URL(url)}catch(err){return $('#link-err').textContent='Add a full web address, like https://expensify.com.'}
    state.links=[...state.links,{name,url}]; save('ea.links.v1',state.links); renderResources(); $('#link-name').focus();
  });
  $('.llist').addEventListener('click',e=>{const b=e.target.closest('.del');if(!b)return;state.links=state.links.filter((_,i)=>i!==+b.dataset.i);save('ea.links.v1',state.links);renderResources()});
}
setInterval(()=>{const c=$('#clocks');if(c)c.innerHTML=clockHTML()},30000);

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1); state.view=['projects','tasks','resources'].includes(h)?h:'projects';
  TopNav();
  ({projects:renderProjects,tasks:renderTasks,resources:renderResources})[state.view]();
  document.title = `${({projects:'Projects',tasks:'Tasks',resources:'Resources'})[state.view]} · Cio EA Dashboard`;
}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
route();
</script>
</body>
</html>
